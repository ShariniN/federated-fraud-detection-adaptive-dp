# Reference: uniform DP + FedProx proximal term (mu = 0.01), size-weighted
name: fedprox_dp
fl: {n_clients: 5, n_rounds: 20, local_epochs: 1, batch_size: 1024, lr: 0.001, weighting: size, mu: 0.01}
